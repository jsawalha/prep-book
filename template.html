<title>Prep Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: single phone-width column, bottom tab bar for thumbs, full-screen cook mode overlay. */
:root {
  --bg: #F1F4F1; --surface: #FFFFFF; --sunk: #E7ECE8; --ink: #18201C; --muted: #5A6760; --line: #D8E0DA;
  --accent: #1E6B50; --accent-ink: #FFFFFF; --accent-soft: #DDEEE5;
  --protein: #B8402B; --carbs: #B07A0B; --fat: #3A68A8;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #1A201C; --sunk: #232B26; --ink: #E7EDE9; --muted: #9AA8A0; --line: #2D3631;
  --accent: #5BC497; --accent-ink: #0C1A13; --accent-soft: #1D3229;
  --protein: #F08068; --carbs: #E5B44A; --fat: #82A9E0; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111613; --surface: #1A201C; --sunk: #232B26; --ink: #E7EDE9; --muted: #9AA8A0; --line: #2D3631;
  --accent: #5BC497; --accent-ink: #0C1A13; --accent-soft: #1D3229;
  --protein: #F08068; --carbs: #E5B44A; --fat: #82A9E0; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 104px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }

/* top */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 8px 14px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }
.brand span { color: var(--accent); }
.back { background: none; border: 0; padding: 8px 0; color: var(--accent); font-weight: 700; font-size: 1rem; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  background: var(--surface); border-top: 1px solid var(--line); padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs-in { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 640px; }
.tab { border: 0; background: none; padding: 10px 8px; border-radius: 12px; font-weight: 700; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 8px; }
.tab[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.badge { min-width: 1.5em; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 0.8rem; line-height: 1.5em; }

/* list */
.controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 14px; }
.field { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
.cards { display: grid; gap: 12px; }
.card { display: grid; gap: 10px; text-align: left; width: 100%; padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); }
.card h2 { font-size: 1.3rem; font-weight: 800; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 0.9rem; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; background: var(--sunk); font-size: 0.82rem; font-weight: 700; color: var(--muted); }
.pill.on { background: var(--accent-soft); color: var(--accent); }

/* macros */
.macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.macro { display: grid; gap: 2px; }
.macro b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.macro small { font-size: 0.75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.macro.p b { color: var(--protein); } .macro.c b { color: var(--carbs); } .macro.f b { color: var(--fat); }
.split { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.split i { display: block; height: 100%; }
.split .p { background: var(--protein); } .split .c { background: var(--carbs); } .split .f { background: var(--fat); }

/* recipe */
.r-head { display: grid; gap: 10px; margin-bottom: 18px; }
.r-head h1 { font-size: clamp(1.8rem, 7vw, 2.4rem); font-weight: 800; letter-spacing: -0.02em; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; }
.panel + .panel, .panel + section, section + section { margin-top: 18px; }
.batch { color: var(--muted); font-size: 0.9rem; }

.scaler h2 { font-size: 1.15rem; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }
.stepper button { height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); font-size: 1.6rem; font-weight: 700; }
.stepper .val { text-align: center; }
.stepper .val input { width: 100%; text-align: center; border: 0; background: none; font-family: var(--display); font-weight: 800; font-size: 2.2rem; padding: 0; }
.stepper .val small { display: block; color: var(--muted); font-size: 0.85rem; margin-top: -4px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 0.92rem; }
.chipbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.anchor { display: grid; gap: 8px; padding-top: 12px; border-top: 1px dashed var(--line); }
.anchor label { font-weight: 700; font-size: 0.95rem; }
.anchor-row { display: grid; grid-template-columns: minmax(0, 1fr) 6.5rem 5rem; gap: 8px; }
.anchor-row .field { padding: 10px; }
.hint { color: var(--muted); font-size: 0.88rem; }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-head h2 { font-size: 1.45rem; font-weight: 800; }
.group + .group { margin-top: 16px; }
.group h3 { font-family: var(--body); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.ings { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.ing { display: grid; grid-template-columns: 28px 6.2rem minmax(0, 1fr); gap: 10px; align-items: start; width: 100%;
  padding: 12px 14px; background: none; border: 0; text-align: left; border-top: 1px solid var(--line); }
.ings li:first-child .ing { border-top: 0; }
.box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; margin-top: 1px; }
.ing[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.ing[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 6px; border: solid var(--accent-ink); border-width: 0 0 3px 3px; transform: translateY(-2px) rotate(-45deg); }
.ing[aria-pressed="true"] .amt, .ing[aria-pressed="true"] .nm { opacity: 0.45; text-decoration: line-through; }
.amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.amt small, .alt { display: block; font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.nm { min-width: 0; }
.nm small { display: block; color: var(--muted); font-size: 0.85rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 18px;
  font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--sunk); color: var(--ink); }
.btn.wide { width: 100%; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; width: 100%; text-align: left; padding: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.step .n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
  font-family: var(--display); font-weight: 800; font-size: 1.1rem; }
.step .t { font-size: 1.08rem; line-height: 1.55; }
.step[aria-pressed="true"] { background: var(--sunk); }
.step[aria-pressed="true"] .t { color: var(--muted); }
.step[aria-pressed="true"] .n { background: var(--accent); color: var(--accent-ink); }
.uses { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.use { padding: 4px 10px; border-radius: 8px; background: var(--sunk); font-size: 0.88rem; }
.use b { font-variant-numeric: tabular-nums; }
.tip { margin-top: 12px; padding: 14px 16px; border-radius: var(--radius); background: var(--accent-soft); line-height: 1.55; }
.tip strong { display: block; color: var(--accent); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.warn { margin-top: 18px; font-size: 0.85rem; color: var(--muted); }

/* shopping */
.shop-recipes { display: grid; gap: 8px; }
.shop-r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.shop-r a { font-weight: 700; text-decoration: none; color: var(--ink); }
.shop-r small { display: block; color: var(--muted); }
.x { border: 0; background: var(--sunk); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 0.88rem; }
.from { color: var(--muted); font-size: 0.8rem; }
.toolbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.toolbar .btn { padding: 12px 8px; font-size: 0.92rem; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty h2 { color: var(--ink); font-size: 1.25rem; margin-bottom: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 0.92rem; }

/* cook mode */
.cook { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.cook-top { display: grid; gap: 10px; max-width: 640px; width: 100%; margin: 0 auto; }
.cook-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.progress { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width 0.25s; }
.cook-body { overflow-y: auto; max-width: 640px; width: 100%; margin: 0 auto; padding-block: 18px; display: grid; align-content: start; gap: 18px; }
.cook-n { font-family: var(--display); font-weight: 800; font-size: 4rem; line-height: 1; color: var(--accent); }
.cook-t { font-size: clamp(1.35rem, 5.6vw, 1.7rem); line-height: 1.45; }
.cook-uses { display: grid; gap: 8px; }
.cook-use { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 1.05rem; }
.cook-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; max-width: 640px; width: 100%; margin: 0 auto; }
.cook-nav .btn { padding: 18px; font-size: 1.1rem; }
.lock { font-size: 0.82rem; color: var(--muted); }

/* tags, notes, advice */
.tagrow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: -4px 0 14px; scrollbar-width: none; }
.tagrow .chipbtn { white-space: nowrap; flex: none; }
.keeps { display: flex; gap: 8px; align-items: baseline; font-size: 0.92rem; }
.keeps b { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); flex: none; }
.mynote { padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--accent); font-size: 0.95rem; }
.mynote b { color: var(--accent); }
.advice { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.advice li { background: var(--surface); padding: 12px 14px 12px 40px; position: relative; line-height: 1.55; }
.advice li::before { content: ""; position: absolute; left: 16px; top: 1.15em; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* plan page */
.prose { line-height: 1.6; }
.prose h2 { font-size: 1.5rem; font-weight: 800; margin: 28px 0 10px; }
.prose h2:first-child { margin-top: 4px; }
.prose h3 { font-size: 1.15rem; margin: 20px 0 8px; }
.prose p { margin: 0 0 12px; max-width: 65ch; }
.prose ul, .prose ol { margin: 0 0 14px; padding-left: 1.25em; display: grid; gap: 8px; }
.prose strong { font-weight: 700; }
.tbl { overflow-x: auto; margin: 4px 0 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 10px 12px; text-align: left; border-top: 1px solid var(--line); vertical-align: top; }
.tbl thead th { border-top: 0; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tbl td:not(:first-child), .tbl th:not(:first-child) { text-align: right; white-space: nowrap; width: 1%; }
.tbl a { color: var(--ink); text-decoration: none; font-weight: 700; }
.tbl td b { color: var(--protein); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">Prep<span>Book</span></div>
    <div class="eyebrow" id="count"></div>
  </header>

  <main id="view-recipe" hidden></main>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" id="tab-list" type="button">Recipes</button>
    <button class="tab" id="tab-plan" type="button">Prep guide</button>

<script id="data" type="application/json">__RECIPES_JSON__</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const RECIPES = DATA.recipes;
const ALL_TAGS = [...new Set(RECIPES.flatMap(r => r.tags))];
const BY_SLUG = Object.fromEntries(RECIPES.map(r => [r.slug, r]));

/* ---------- storage (optional; page works without it) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("prepbook:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("prepbook:" + k, JSON.stringify(v)); } catch {} },
};
const state = {
  scale: store.get("scale", {}),      // slug -> factor
  have: store.get("have", {}),        // slug -> {ingId: true}
  shop: store.get("shop", {}),        // slug -> factor
  got: store.get("got", {}),          // shopping key -> true
  sort: store.get("sort", "name"),
  tag: store.get("tag", ""),
  done: {},                           // slug -> {stepIdx: true} (this visit only)
};
const save = k => store.set(k, state[k]);

/* ---------- units & formatting ---------- */
const VOL = { tsp: 1, tbsp: 3, cup: 48, ml: 0.2029, l: 202.9 };    // in tsp
const WT = { g: 1, kg: 1000, oz: 28.3495, lb: 453.592 };           // in g
const PLURAL = { cup: "cups", clove: "cloves", can: "cans", slice: "slices", scoop: "scoops", second: "seconds",
  head: "heads", stalk: "stalks", packet: "packets", bunch: "bunches", pinch: "pinches", dash: "dashes",
  leaf: "leaves", handful: "handfuls", block: "blocks", piece: "pieces" };
// Only fractions you can actually measure with a normal spoon/cup set.
const FRACS = [[0, ""], [1/4, "¼"], [1/3, "⅓"], [1/2, "½"], [2/3, "⅔"], [3/4, "¾"], [1, ""]];
const isClean = q => FRACS.some(([f]) => Math.abs((q % 1) - f) < 0.03);
const COUNT_FRACS = [[0, ""], [1/4, "¼"], [1/2, "½"], [3/4, "¾"], [1, ""]];

function frac(q, table = FRACS) {
  if (q <= 0) return "0";
  let whole = Math.floor(q), rest = q - whole, best = table[0];
  for (const f of table) if (Math.abs(rest - f[0]) < Math.abs(rest - best[0])) best = f;
  if (best[0] === 1) { whole += 1; best = [0, ""]; }
  if (whole === 0 && best[0] === 0) return "¼";
  return (whole ? String(whole) : "") + best[1];
}
const trim = (n, d) => String(+n.toFixed(d));
const unitLabel = (u, q) => !u ? "" : (q > 1 && PLURAL[u]) ? PLURAL[u] : u;

/* Pick a friendlier unit after scaling (12 tbsp -> ¾ cup, 0.1 cup -> 1½ tbsp). */
function tidy(q, unit) {
  if (unit === "tsp" && q >= 3) return tidy(q / 3, "tbsp");
  if (unit === "tbsp" && q >= 8) return [q / 16, "cup"];
  if (unit === "tbsp" && q < 1) return [q * 3, "tsp"];
  if (unit === "cup" && (q < 0.25 || (q < 1 && !isClean(q)))) return tidy(q * 16, "tbsp");
  if (unit === "oz" && q >= 16) return [q / 16, "lb"];
  if (unit === "g" && q >= 1000) return [q / 1000, "kg"];
  return [q, unit];
}

/* -> {main: "¾ cup", alt: "340 g" | ""} */
function amount(q, unit, qmax) {
  if (q == null) return { main: "", alt: "" };
  let [v, u] = tidy(q, unit);
  let main, alt = "";
  if (u === "lb") { main = trim(v, 2) + " lb"; alt = v * 0.453592 >= 1 ? trim(v * 0.453592, 2) + " kg" : Math.round(v * 453.592 / 5) * 5 + " g"; }
  else if (u === "oz") { main = trim(v, 1) + " oz"; alt = Math.round(v * 28.35) + " g"; }
  else if (u === "kg") main = trim(v, 2) + " kg";
  else if (u === "g") main = (v >= 100 ? Math.round(v / 5) * 5 : Math.round(v)) + " g";
  else if (u === "ml") main = Math.round(v) + " ml";
  else if (u === "l") main = trim(v, 2) + " l";
  else if (u in VOL) main = frac(v) + " " + unitLabel(u, v);
  else {                                   // counts, cloves, cans, seconds...
    const n = v >= 10 ? String(Math.round(v)) : frac(v, COUNT_FRACS);
    main = n + (u ? " " + unitLabel(u, v) : "");
  }
  if (qmax != null && qmax !== q) {
    const hi = amount(qmax, unit).main;
    main = main.split(" ")[0] + "–" + hi;
  }
  return { main, alt };
}

function scaled(ing, f) {
  if (ing.qty == null) return { main: "", alt: "" };
  if (!ing.scalable) return amount(ing.qty, ing.unit, ing.qty_max);
  return amount(ing.qty * f, ing.unit, ing.qty_max == null ? null : ing.qty_max * f);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtServ = s => trim(s, 1);
const factorOf = slug => state.scale[slug] || 1;

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
}

/* ---------- macros ---------- */
function macroBlock(m) {
  const pc = (m.protein || 0) * 4, cc = (m.carbs || 0) * 4, fc = (m.fat || 0) * 9, tot = pc + cc + fc || 1;
  return `
    <div class="macros">
      <div class="macro"><b>${m.calories ?? "–"}</b><small>Cal</small></div>
      <div class="macro p"><b>${m.protein ?? "–"}g</b><small>Protein</small></div>
      <div class="macro c"><b>${m.carbs ?? "–"}g</b><small>Carbs</small></div>
      <div class="macro f"><b>${m.fat ?? "–"}g</b><small>Fat</small></div>
    </div>
    <div class="split" aria-hidden="true"><i class="p" style="width:${pc / tot * 100}%"></i><i class="c" style="width:${cc / tot * 100}%"></i><i class="f" style="width:${fc / tot * 100}%"></i></div>`;
}

/* ---------- list view ---------- */
let query = "";
function renderList() {
  const v = document.getElementById("view-list");
  const q = query.trim().toLowerCase();
  if (state.tag && !ALL_TAGS.includes(state.tag)) state.tag = "";
  let list = RECIPES.filter(r => (!state.tag || r.tags.includes(state.tag)) &&
    (!q || [r.title, ...r.tags, ...r.ingredients.map(i => i.name)].join(" ").toLowerCase().includes(q)));
  const m = r => r.macros || {};
  const sorts = {
    name: (a, b) => a.title.localeCompare(b.title),
    protein: (a, b) => (m(b).protein || 0) - (m(a).protein || 0),
    calories: (a, b) => (m(a).calories || 1e9) - (m(b).calories || 1e9),
    ratio: (a, b) => (m(b).protein || 0) / (m(b).calories || 1e9) - (m(a).protein || 0) / (m(a).calories || 1e9),
  };
  list.sort(sorts[state.sort] || sorts.name);
  v.innerHTML = `
    <div class="controls">
      <input class="field" id="search" type="search" placeholder="Search recipes or ingredients" value="${esc(query)}" autocomplete="off">
      <select class="field" id="sort" aria-label="Sort recipes">
        <option value="name">A–Z</option><option value="protein">Most protein</option>
        <option value="calories">Fewest calories</option><option value="ratio">Protein per calorie</option>
      </select>
    </div>
    ${ALL_TAGS.length ? `<div class="tagrow" role="group" aria-label="Filter by tag">
      <button class="chipbtn" type="button" data-tag="" aria-pressed="${!state.tag}">All</button>
      ${ALL_TAGS.map(t => `<button class="chipbtn" type="button" data-tag="${esc(t)}" aria-pressed="${state.tag === t}">${esc(t)}</button>`).join("")}
    </div>` : ""}
    <div class="cards">
      ${list.map(r => `
        <a class="card" href="#r-${r.slug}" style="color:inherit;text-decoration:none">
          <h2>${esc(r.title)}</h2>
          ${macroBlock(r.macros || {})}
          <div class="card-meta">
            <span>Makes ${fmtServ(r.servings)}</span>
            <span>${r.ingredients.length} ingredients</span>
            <span>${r.steps.filter(s => !s.tip).length} steps</span>
            ${state.shop[r.slug] ? '<span class="pill on">On shopping list</span>' : ""}
            ${r.tags.map(t => `<span class="pill">${esc(t)}</span>`).join("")}
          </div>
          ${r.keeps ? `<div class="keeps"><b>Keeps</b><span>${esc(r.keeps)}</span></div>` : ""}
        </a>`).join("") || `<div class="empty"><h2>No matches</h2>Try a different word, like “beef” or “rice”.</div>`}
    </div>`;
  const s = document.getElementById("search");
  s.addEventListener("input", e => { query = e.target.value; const pos = e.target.selectionStart; renderList(); const n = document.getElementById("search"); n.focus(); n.setSelectionRange(pos, pos); });
  const so = document.getElementById("sort");
  so.value = state.sort;
  so.addEventListener("change", e => { state.sort = e.target.value; save("sort"); renderList(); });
  v.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", () => { state.tag = b.dataset.tag; save("tag"); renderList(); }));
}

/* ---------- recipe view ---------- */
function anchorOptions(r) {
  return r.ingredients.filter(i => i.scalable && i.qty);
}
function unitChoices(unit) {
  if (unit in WT) return ["lb", "kg", "g", "oz"];
  if (unit in VOL) return ["cup", "tbsp", "tsp", "ml"];
  return [unit || "count"];
}
function toBase(q, unit) { return unit in WT ? q * WT[unit] : unit in VOL ? q * VOL[unit] : q; }

function renderRecipe(slug) {
  const r = BY_SLUG[slug];
  const v = document.getElementById("view-recipe");
  if (!r) { v.innerHTML = `<div class="empty"><h2>Recipe not found</h2><a href="#">Back to recipes</a></div>`; return; }
  const f = factorOf(slug);
  const serv = r.servings * f;
  const have = state.have[slug] || {};
  const done = state.done[slug] || {};
  const m = r.macros || {};
  const anchors = anchorOptions(r);
  const defAnchor = anchors.find(i => i.aisle === "Meat & seafood") || anchors[0];
  const aId = v.dataset.anchor && r.ingredients[+v.dataset.anchor] && v.dataset.slug === slug ? +v.dataset.anchor : defAnchor?.id;
  const anchor = r.ingredients[aId];
  const aUnit = v.dataset.aunit && v.dataset.slug === slug && unitChoices(anchor?.unit).includes(v.dataset.aunit) ? v.dataset.aunit : anchor?.unit || "count";
  const aVal = anchor ? (anchor.unit in WT || anchor.unit in VOL ? toBase(anchor.qty * f, anchor.unit) / toBase(1, aUnit) : anchor.qty * f) : 0;
  v.dataset.slug = slug;

  const groups = r.sections.map(sec => {
    const items = r.ingredients.filter(i => i.section === sec);
    return `<div class="group">
      ${r.sections.length > 1 || sec !== "Ingredients" ? `<h3>${esc(sec)}</h3>` : ""}
      <ul class="ings">${items.map(i => { const a = scaled(i, f); return `
        <li><button class="ing" type="button" data-have="${i.id}" aria-pressed="${!!have[i.id]}">
          <span class="box" aria-hidden="true"></span>
          <span class="amt">${esc(a.main) || "—"}${a.alt ? `<small>${esc(a.alt)}</small>` : ""}</span>
          <span class="nm">${esc(i.name)}${i.note ? `<small>${esc(i.note)}</small>` : ""}</span>
        </button></li>`; }).join("")}</ul></div>`;
  }).join("");

  const steps = r.steps.filter(s => !s.tip), tips = r.steps.filter(s => s.tip);
  const stepHtml = steps.map((s, idx) => `
    <li><button class="step" type="button" data-step="${idx}" aria-pressed="${!!done[idx]}">
      <span class="n">${s.n}</span>
      <span><span class="t">${esc(s.text)}</span>
      ${s.uses.length ? `<span class="uses">${s.uses.map(id => { const i = r.ingredients[id]; const a = scaled(i, f);
        return `<span class="use">${a.main ? `<b>${esc(a.main)}</b> ` : ""}${esc(i.name)}</span>`; }).join("")}</span>` : ""}
      </span></button></li>`).join("");

  v.innerHTML = `
    <button class="back" type="button" data-go="#">← All recipes</button>
    <div class="r-head">
      <div class="eyebrow">Per serving · makes ${fmtServ(r.servings)} as written</div>
      <h1>${esc(r.title)}</h1>
      ${macroBlock(m)}
      <div class="batch num">This batch: ${fmtServ(serv)} containers · ${Math.round((m.protein || 0) * serv)}g protein · ${Math.round((m.calories || 0) * serv).toLocaleString()} cal total</div>
      ${r.keeps ? `<div class="keeps"><b>Keeps</b><span>${esc(r.keeps)}</span></div>` : ""}
      ${(r.notes || []).map(n => `<div class="mynote"><b>Your note:</b> ${esc(n)}</div>`).join("")}
    </div>

    <div class="panel scaler">
      <h2>How much are you making?</h2>
      <div class="stepper">
        <button type="button" data-serv="-1" aria-label="One fewer serving">−</button>
        <div class="val"><input id="serv" class="num" type="number" inputmode="decimal" min="0.5" step="1" value="${fmtServ(serv)}" aria-label="Servings"><small>servings</small></div>
        <button type="button" data-serv="1" aria-label="One more serving">+</button>
      </div>
      <div class="quick">
        ${[0.5, 1, 1.5, 2, 3].map(x => `<button class="chipbtn" type="button" data-factor="${x}" aria-pressed="${Math.abs(f - x) < 1e-9}">${x === 0.5 ? "½" : x === 1.5 ? "1½" : x}×</button>`).join("")}
      </div>
      ${anchor ? `
      <div class="anchor">
        <label for="anchor-amt">Or start from what you have</label>
        <div class="anchor-row">
          <select class="field" id="anchor-ing" aria-label="Ingredient">${anchors.map(i => `<option value="${i.id}" ${i.id === aId ? "selected" : ""}>${esc(i.core)}${r.sections.length > 1 && anchors.filter(x => x.core === i.core).length > 1 ? ` (${esc(i.section)})` : ""}</option>`).join("")}</select>
          <input class="field num" id="anchor-amt" type="number" inputmode="decimal" min="0" step="any" value="${trim(aVal, 2)}">
          <select class="field" id="anchor-unit" aria-label="Unit">${unitChoices(anchor.unit).map(u => `<option ${u === aUnit ? "selected" : ""}>${u}</option>`).join("")}</select>
        </div>
        <div class="hint">Type how much ${esc(anchor.core)} you have and everything else scales to match.</div>
      </div>` : ""}
    </div>

    <section>
      <div class="sec-head"><h2>Ingredients</h2><span class="hint">Tap to check off</span></div>
      ${groups}
      <div class="actions">
        <button class="btn" type="button" id="add-shop">${state.shop[slug] ? "Update shopping list" : "Add to shopping list"}</button>
        <button class="btn ghost" type="button" id="clear-have">Uncheck all</button>
      </div>
    </section>

    <section>
      <div class="sec-head"><h2>Steps</h2><span class="hint">Tap a step when done</span></div>
      <button class="btn wide" type="button" id="cook-start" style="margin-bottom:12px">Start cook mode</button>
      <ol class="steps">${stepHtml}</ol>
      ${tips.map(t => `<div class="tip"><strong>Meal prep tip</strong>${esc(t.text)}</div>`).join("")}
    </section>

    ${(r.advice || []).length ? `<section>
      <div class="sec-head"><h2>Prep advice</h2></div>
      <ul class="advice">${r.advice.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
    </section>` : ""}

    ${r.link ? `<p class="hint" style="margin-top:22px"><a href="${esc(r.link)}" target="_blank" rel="noopener">View the original post</a></p>` : ""}
    ${r.warnings.length ? `<p class="warn">Parser notes: ${r.warnings.map(esc).join("; ")}</p>` : ""}`;

  const setFactor = nf => {
    if (!(nf > 0) || !isFinite(nf)) return;
    state.scale[slug] = nf; save("scale");
    if (state.shop[slug]) { state.shop[slug] = nf; save("shop"); }
    const y = window.scrollY; renderRecipe(slug); window.scrollTo(0, y);
  };
  v.querySelectorAll("[data-serv]").forEach(b => b.addEventListener("click", () => {
    const cur = r.servings * factorOf(slug);
    const next = Math.max(1, Math.round(cur) + +b.dataset.serv);
    setFactor(next / r.servings);
  }));
  const servIn = document.getElementById("serv");
  servIn.addEventListener("change", () => setFactor(parseFloat(servIn.value) / r.servings));
  v.querySelectorAll("[data-factor]").forEach(b => b.addEventListener("click", () => setFactor(+b.dataset.factor)));
  if (anchor) {
    const amt = document.getElementById("anchor-amt");
    amt.addEventListener("change", () => {
      const val = parseFloat(amt.value);
      if (!(val > 0)) return;
      const base = anchor.unit in WT || anchor.unit in VOL ? toBase(val, aUnit) / toBase(anchor.qty, anchor.unit) : val / anchor.qty;
      setFactor(base);
    });
    document.getElementById("anchor-ing").addEventListener("change", e => { v.dataset.anchor = e.target.value; v.dataset.aunit = ""; renderRecipe(slug); });
    document.getElementById("anchor-unit").addEventListener("change", e => { v.dataset.anchor = aId; v.dataset.aunit = e.target.value; renderRecipe(slug); });
  }
  v.querySelectorAll("[data-have]").forEach(b => b.addEventListener("click", () => {
    const h = state.have[slug] = state.have[slug] || {};
    const id = b.dataset.have; h[id] = !h[id]; if (!h[id]) delete h[id];
    b.setAttribute("aria-pressed", String(!!h[id])); save("have");
  }));
  v.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
    const d = state.done[slug] = state.done[slug] || {};
    const id = b.dataset.step; d[id] = !d[id];
    b.setAttribute("aria-pressed", String(!!d[id]));
  }));
  document.getElementById("clear-have").addEventListener("click", () => { delete state.have[slug]; save("have"); const y = scrollY; renderRecipe(slug); scrollTo(0, y); });
  document.getElementById("add-shop").addEventListener("click", () => {
    const was = !!state.shop[slug];
    state.shop[slug] = factorOf(slug); save("shop"); updateBadge();
    document.getElementById("add-shop").textContent = "Update shopping list";
    toast(was ? `Updated to ${fmtServ(serv)} servings` : `Added ${fmtServ(serv)} servings`);
  });
  document.getElementById("cook-start").addEventListener("click", () => openCook(slug));
  v.querySelector("[data-go]").addEventListener("click", () => { location.hash = ""; });
}

/* ---------- cook mode ---------- */
let cook = null, wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch { wakeLock = null; }
  const el = document.getElementById("lock");
  if (el) el.textContent = wakeLock ? "Screen will stay on" : "";
}
function openCook(slug) {
  cook = { slug, i: 0 };
  document.getElementById("cook").hidden = false;
  document.body.style.overflow = "hidden";
  renderCook(); keepAwake();
}
function closeCook() {
  document.getElementById("cook").hidden = true;
  document.body.style.overflow = "";
  try { wakeLock?.release(); } catch {}
  wakeLock = null; cook = null;
}
function renderCook() {
  const r = BY_SLUG[cook.slug], f = factorOf(cook.slug);
  const steps = r.steps.filter(s => !s.tip), tips = r.steps.filter(s => s.tip);
  const total = steps.length + (tips.length ? 1 : 0);
  const i = cook.i, s = steps[i];
  const el = document.getElementById("cook");
  el.innerHTML = `
    <div class="cook-top">
      <div class="cook-bar">
        <button class="back" type="button" id="cook-close">✕ Close</button>
        <span class="eyebrow num">${i < steps.length ? `Step ${i + 1} of ${steps.length}` : "Before you pack it up"}</span>
      </div>
      <div class="progress"><i style="width:${(i + 1) / total * 100}%"></i></div>
      <div class="lock" id="lock">${wakeLock ? "Screen will stay on" : ""}</div>
    </div>
    <div class="cook-body">
      ${s ? `
        <div class="cook-n">${s.n}</div>
        <div class="cook-t">${esc(s.text)}</div>
        ${s.uses.length ? `<div class="cook-uses">${s.uses.map(id => { const ing = r.ingredients[id], a = scaled(ing, f);
          return `<div class="cook-use"><span class="amt">${esc(a.main) || "—"}${a.alt ? `<small>${esc(a.alt)}</small>` : ""}</span><span>${esc(ing.name)}</span></div>`; }).join("")}</div>` : ""}`
      : tips.map(t => `<div class="tip" style="font-size:1.15rem"><strong>Meal prep tip</strong>${esc(t.text)}</div>`).join("")}
    </div>
    <div class="cook-nav">
      <button class="btn ghost" type="button" id="cook-prev" ${i === 0 ? "disabled" : ""}>Back</button>
      <button class="btn" type="button" id="cook-next">${i >= total - 1 ? "Done" : "Next step"}</button>
    </div>`;
  document.getElementById("cook-close").onclick = closeCook;
  document.getElementById("cook-prev").onclick = () => { if (cook.i > 0) { cook.i--; renderCook(); } };
  document.getElementById("cook-next").onclick = () => {
    const d = state.done[cook.slug] = state.done[cook.slug] || {};
    if (cook.i < steps.length) d[cook.i] = true;
    if (cook.i >= total - 1) { const sl = cook.slug; closeCook(); renderRecipe(sl); return; }
    cook.i++; renderCook();
  };
}
document.addEventListener("visibilitychange", () => { if (cook && document.visibilityState === "visible") keepAwake(); });
document.addEventListener("keydown", e => {
  if (!cook) return;
  if (e.key === "Escape") closeCook();
  if (e.key === "ArrowRight") document.getElementById("cook-next").click();
  if (e.key === "ArrowLeft") document.getElementById("cook-prev").click();
});

/* ---------- shopping list ---------- */
function shoppingItems() {
  const items = new Map();
  for (const [slug, f] of Object.entries(state.shop)) {
    const r = BY_SLUG[slug]; if (!r) continue;
    for (const ing of r.ingredients) {
      const dim = ing.unit in VOL ? "vol" : ing.unit in WT ? "wt" : (ing.unit || "count");
      if (ing.aisle === "Skip") continue;
      const key = (ing.key || ing.core) + "|" + (ing.scalable ? dim : "x");
      let it = items.get(key);
      if (!it) items.set(key, it = { key, name: ing.name, aisle: ing.aisle, dim, total: 0, hasQty: false, units: new Set(), from: new Set(), qmaxNote: false });
      it.from.add(r.title);
      if (ing.scalable && ing.qty != null) {
        const q = ing.qty * f;
        it.total += dim === "vol" ? q * VOL[ing.unit] : dim === "wt" ? q * WT[ing.unit] : q;
        it.hasQty = true; it.units.add(ing.unit);
        if (ing.qty_max != null) it.qmaxNote = true;
      }
    }
  }
  for (const it of items.values()) {
    if (!it.hasQty) { it.amt = { main: "", alt: "" }; continue; }
    if (it.dim === "vol") {
      const t = it.total;
      it.amt = t >= 12 ? amount(t / 48, "cup") : t >= 3 ? amount(t / 3, "tbsp") : amount(t, "tsp");  // amount() tidies awkward cups
    } else if (it.dim === "wt") {
      it.amt = it.units.has("lb") || it.units.has("oz") ? amount(it.total / WT.lb, "lb") : amount(it.total, "g");
    } else {
      it.amt = amount(it.total, it.dim === "count" ? null : it.dim);
    }
  }
  return [...items.values()];
}
const AISLE_ORDER = ["Produce", "Meat & seafood", "Dairy, eggs & tofu", "Grains & bread", "Sauces & oils", "Spices & pantry", "Other"];

let confirmClear = false;
function renderShop() {
  const v = document.getElementById("view-shop");
  const slugs = Object.keys(state.shop).filter(s => BY_SLUG[s]);
  if (!slugs.length) {
    v.innerHTML = `<div class="sec-head"><h2 style="font-size:1.8rem">Shopping list</h2></div>
      <div class="empty"><h2>Nothing on your list yet</h2>Open a recipe, set your servings, and tap “Add to shopping list”. Amounts from every recipe get combined here.</div>`;
    return;
  }
  const items = shoppingItems();
  const left = items.filter(i => !state.got[i.key]).length;
  const byAisle = AISLE_ORDER.map(a => [a, items.filter(i => i.aisle === a).sort((x, y) => x.name.localeCompare(y.name))]).filter(([, l]) => l.length);
  v.innerHTML = `
    <div class="sec-head"><h2 style="font-size:1.8rem">Shopping list</h2><span class="hint num">${left} of ${items.length} left</span></div>
    <div class="shop-recipes">
      ${slugs.map(s => { const r = BY_SLUG[s]; return `
        <div class="shop-r"><div><a href="#r-${s}">${esc(r.title)}</a><small class="num">${fmtServ(r.servings * state.shop[s])} servings</small></div>
        <button class="x" type="button" data-remove="${s}">Remove</button></div>`; }).join("")}
    </div>
    <div class="toolbar" style="margin-block:14px 18px">
      <button class="btn" type="button" id="copy">Copy list</button>
      <button class="btn ghost" type="button" id="uncheck">Uncheck all</button>
      <button class="btn ghost" type="button" id="clear">${confirmClear ? "Tap again to clear" : "Clear list"}</button>
    </div>
    ${byAisle.map(([a, list]) => `
      <div class="group"><h3>${esc(a)}</h3>
        <ul class="ings">${list.map(it => `
          <li><button class="ing" type="button" data-got="${esc(it.key)}" aria-pressed="${!!state.got[it.key]}">
            <span class="box" aria-hidden="true"></span>
            <span class="amt">${esc(it.amt.main) || "—"}${it.amt.alt ? `<small>${esc(it.amt.alt)}</small>` : ""}</span>
            <span class="nm">${esc(it.name)}${slugs.length > 1 ? `<small class="from">${[...it.from].map(esc).join(", ")}</small>` : ""}</span>
          </button></li>`).join("")}</ul>
      </div>`).join("")}`;

  v.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => { delete state.shop[b.dataset.remove]; save("shop"); updateBadge(); renderShop(); }));
  v.querySelectorAll("[data-got]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.got; state.got[k] = !state.got[k]; if (!state.got[k]) delete state.got[k]; save("got");
    b.setAttribute("aria-pressed", String(!!state.got[k]));
    v.querySelector(".sec-head .hint").textContent = `${items.filter(i => !state.got[i.key]).length} of ${items.length} left`;
  }));
  document.getElementById("uncheck").onclick = () => { state.got = {}; save("got"); renderShop(); };
  document.getElementById("clear").onclick = () => {
    if (!confirmClear) { confirmClear = true; renderShop(); setTimeout(() => { if (confirmClear) { confirmClear = false; if (!document.getElementById("view-shop").hidden) renderShop(); } }, 3000); return; }
    confirmClear = false; state.shop = {}; state.got = {}; save("shop"); save("got"); updateBadge(); renderShop();
  };
  document.getElementById("copy").onclick = async () => {
    const text = byAisle.map(([a, list]) => {
      const rows = list.filter(i => !state.got[i.key]).map(i => `- ${i.amt.main ? i.amt.main + " " : ""}${i.name}`);
      return rows.length ? `${a}\n${rows.join("\n")}` : "";
    }).filter(Boolean).join("\n\n");
    try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into Notes or Reminders"); }
    catch { toast("Copy isn't allowed here. Long-press to select the list instead"); }
  };
}

function updateBadge() {
  const n = Object.keys(state.shop).filter(s => BY_SLUG[s]).length;
  const b = document.getElementById("shop-count");
  b.textContent = n; b.hidden = !n;
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash.slice(1);
  const views = { list: document.getElementById("view-list"), recipe: document.getElementById("view-recipe"),
    plan: document.getElementById("view-plan"), shop: document.getElementById("view-shop") };
  let which = "list";
  if (h.startsWith("r-")) which = "recipe";
  else if (h === "shop") which = "shop";
  else if (h === "plan") which = "plan";
  for (const [k, el] of Object.entries(views)) el.hidden = k !== which;
  document.getElementById("tab-list").setAttribute("aria-current", String(which === "list" || which === "recipe"));
  document.getElementById("tab-plan").setAttribute("aria-current", String(which === "plan"));
  document.getElementById("tab-shop").setAttribute("aria-current", String(which === "shop"));
  if (cook) closeCook();
  if (which === "list") renderList();
  if (which === "recipe") renderRecipe(h.slice(2));
  if (which === "shop") renderShop();
  if (which === "plan") views.plan.innerHTML = `<article class="prose">${DATA.guide || '<div class="empty"><h2>No guide yet</h2>Add a guide.md file next to build.py.</div>'}</article>`;
  window.scrollTo(0, 0);
}
document.getElementById("tab-list").onclick = () => { const had = location.hash; location.hash = ""; if (!had || had === "#") route(); };
document.getElementById("tab-shop").onclick = () => { location.hash = "shop"; };
document.getElementById("tab-plan").onclick = () => { location.hash = "plan"; };
window.addEventListener("hashchange", route);
document.getElementById("count").textContent = `${RECIPES.length} recipe${RECIPES.length === 1 ? "" : "s"}`;
updateBadge();
route();
})();
</script>
